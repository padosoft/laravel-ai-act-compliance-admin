name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feature/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    name: Frontend (Node 20)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Type-check
        run: npx tsc --noEmit

      - name: Vite build
        run: npm run build

      - name: Vitest unit suite
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    name: E2E (Playwright / chromium)
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Install Playwright browsers (chromium)
        run: npx playwright install --with-deps chromium

      - name: Build admin SPA
        run: npm run build

      - name: Start vite preview (background)
        run: |
          npx vite preview --port 5173 --host 127.0.0.1 &
          echo $! > vite-preview.pid

      - name: Wait for preview
        run: npx wait-on http://127.0.0.1:5173 --timeout 60000

      - name: Run Playwright
        env:
          AICOMPLIANCE_ADMIN_E2E_BASE: 'http://127.0.0.1:5173'
        run: npx playwright test --project=chromium

      - name: Stop vite preview
        if: always()
        run: |
          if [ -f vite-preview.pid ]; then
            kill "$(cat vite-preview.pid)" 2>/dev/null || true
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
